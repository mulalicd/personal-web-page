<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a6fbf" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the visitor's theme before first paint (the homepage is prerendered in light) -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <!-- Inter for every OS (Windows/macOS/Android/iOS would otherwise fall back to different system fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: the page paints with the fallback font and swaps to Inter when it arrives -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>
    <!-- Hero portrait is the LCP element: fetch it before the JS bundle discovers it -->
    <link rel="preload" as="image" href="/davor-portrait.webp" type="image/webp" fetchpriority="high" />
    <title>Davor Mulalić — C-Level AI Leader | CEO & Managing Director</title>
    <meta name="description" content="Davor Mulalić — C-Level AI Leader, CEO &amp; Managing Director with 25+ years driving growth across education, finance, manufacturing and corporate sectors. Grew operating income from €12M to €16M (+33%). Available now for CEO / COO / Chief AI mandates." />
    <meta name="author" content="Davor Mulalić" />
    <meta name="keywords" content="CEO, Executive Leader, AI Strategy, Digital Transformation, Managing Director, Business Leadership, EdTech, International Education, Operational Excellence" />
    <link rel="canonical" href="https://mulalic.ai-studio.wiki" />

    <meta property="og:title" content="Davor Mulalić — C-Level AI Leader" />
    <meta property="og:description" content="CEO &amp; Managing Director with 25+ years driving growth, innovation, and operational excellence. Expert in AI Strategy &amp; Digital Transformation. Available now for CEO / COO / Chief AI mandates." />

    <meta property="og:url" content="https://mulalic.ai-studio.wiki" />
    <meta property="og:image" content="https://mulalic.ai-studio.wiki/og-image.png" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:image" content="https://mulalic.ai-studio.wiki/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Davor Mulalić — C-Level AI Leader" />
    <meta name="twitter:description" content="CEO &amp; Managing Director with 25+ years driving growth, innovation, and operational excellence. Expert in AI Strategy &amp; Digital Transformation." />

    {
      "@context": "https://schema.org",

      "name": "Davor Mulalić",
      "jobTitle": "C-Level AI Leader, CEO & Managing Director",
