project_id = "qixpdeqjrkvfurqhzvtc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "https://mulalic.ai-studio.wiki"
# Password-reset links may only return to the site itself.
additional_redirect_urls = ["https://mulalic.ai-studio.wiki/reset-password", "http://localhost:8080/reset-password"]
# Public self-registration must be OFF (CONSTITUTION P-4) — set in the dashboard
# (Authentication → Sign In / Providers → "Allow new users to sign up").
# Do NOT run `supabase config push` with this minimal file: it would also reset
# MFA and email-confirmation settings to local defaults (found 2026-09-26).
enable_signup = false

